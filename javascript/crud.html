<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
</head>
<body>
    <div class="container mt-4"> 
        <h1>Cadastro de Produtos</h1> 
        <form id="formProduto"> 
            <input type="text" id="nome" class="form-control mb-2" placeholder="Nome" > 
            <input type="number" id="preco" class="form-control mb-2" placeholder="Preço" > 
            <input type="text" id="categoria" class="form-control mb-2" placeholder="Categoria" > 
            <input type="number" id="estoque" class="form-control mb-2" placeholder="Estoque" > 
            <button class="btn btn-primary"> 
                Cadastrar 
            </button> 
        </form> 
        <hr> 
        <div id="listaProdutos"></div> 
    </div>
</body>
</html>
