<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
</head>
<body>

  <h1>Cadastro de Usuário</h1>

  <!-- Redireciona para a tela de login ao enviar -->
  <form action="index.html" method="GET">
    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
    </div>
    <br>
    <div>
      <label for="sobrenome">Sobrenome:</label>
      <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
    </div>
    <br>
    <div>
      <label for="dataNascimento">Data de Nascimento:</label>
      <input type="date" id="dataNascimento" name="dataNascimento" required>
    </div>
    <br>
    <div>
      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
    </div>
    <br>
    <div>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
    </div>
    <br>
    <div>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" required>
    </div>
    <br>
    <div>
      <button type="reset">Limpar</button>
      <button type="submit">Cadastrar</button>
    </div>
  </form>

  <hr>

  <div>
    <p>Já tem uma conta? <a href="index.html">Faça login</a></p>
  </div>

</body>
</html>
