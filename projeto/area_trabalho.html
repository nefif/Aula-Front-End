<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Exercício Grid Bootstrap</title>
</head>
<body>
    <div class="container mt-4">
        <!-- Cabeçalho -->
        <div class="row mb-3">
            <div class="col-12 bg-primary text-white text-center p-4">
                <h2>Portal de Gestão</h2>
            </div>
        </div>
        <!-- Conteúdo -->
        <div class="row mb-3">
            <!-- Menu -->
            <div class="col-md-3 bg-light border p-3">
                <h4>Menu</h4>
                <ul class="list-group">
                    <li class="list-group-item">Painel</li>
                    <li class="list-group-item">Projetos</li>
                    <li class="list-group-item">Tarefas</li>
                    <li class="list-group-item rounded">Usuários</li>
                    <li class="list-group-item bg-danger text-white mt-3 rounded">Sair</li>
                </ul>
            </div>
            <!-- Conteúdo Principal -->
            <div class="col-md-9 bg-white border p-3">
                <h3>Painel</h3>

                <div class="alert alert-success">
                    Exemplo de conteúdo utilizando Bootstrap.
                </div>

                <div class="alert alert-warning">
                    Exemplo de conteúdo utilizando Bootstrap.
                </div>

                <div class="alert alert-danger">
                    Exemplo de conteúdo utilizando Bootstrap.
                </div>

                <div class="alert alert-primary">
                    Exemplo de conteúdo utilizando Bootstrap.
                </div>
            </div>
        </div>
        <!-- Rodapé -->
        <div class="row">
            <div class="col-12 bg-dark text-white text-center p-3">
                Rodapé
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
