<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <div class="card-body">
      <h3 class="card-title text-center mb-4 fw-bold text-primary">Acessar Conta</h3>
      
      <!-- O atributo action="area_trabalho.html" direciona para a área de trabalho após o envio -->
      <form action="area_trabalho.html" method="GET">
        <!-- Campo Nome -->
        <div class="mb-3">
          <label for="nome" class="form-label fw-semibold">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <!-- Campo Senha -->
        <div class="mb-3">
          <label for="senha" class="form-label fw-semibold">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <!-- Botão de Esqueci a Senha -->
        <div class="text-end mb-3">
          <a href="#" class="btn btn-link p-0 text-decoration-none small">Esqueci minha senha</a>
        </div>

        <!-- Botão de Login -->
        <button type="submit" class="btn btn-primary w-100 mb-3 fw-semibold">Entrar</button>

        <hr class="my-4">

        <!-- Botão de Cadastro de Usuário -->
        <div class="d-grid">
          <a href="cadastro_usuario.html" class="btn btn-outline-success fw-semibold">Criar nova conta</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
