<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Tarefa com Navbar - Bootstrap 5</title>
  
  <!-- Bootstrap 5 CSS e Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <!-- NAVBAR NO TOPO -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Meu Projeto</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="menuNavegacao">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Projetos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="../projeto/listar_tarefa.html">Tarefas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Usuários</a>
          </li>
        </ul>

        <!-- Mensagem de Boas-vindas e Botão Sair -->
        <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0">
          <span class="navbar-text text-white">
            Bem-vindo(a), <strong>Maria</strong>!
          </span>
          <button class="btn btn-outline-light btn-sm" type="button">Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="container my-4">
    
    <div class="card shadow-sm">
      
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0 fs-5"><i class="bi bi-file-earmark-plus"></i> Cadastrar Nova Tarefa</h4>
      </div>

      <div class="card-body p-4">
        
        <form action="/listar_tarefa.html" method="POST">
          
          <div class="row g-3">
            
            <!-- Campo: ID da Tarefa -->
            <div class="col-md-4">
              <label for="idTarefa" class="form-label">ID da Tarefa</label>
              <input type="text" class="form-control" id="idTarefa" name="idTarefa" value="#AUTOGERADO" disabled readonly>
            </div>

            <!-- Campo: Projeto Vinculado -->
            <div class="col-md-8">
              <label for="projetoVinculado" class="form-label">Projeto Vinculado <span class="text-danger">*</span></label>
              <select class="form-select" id="projetoVinculado" name="projetoVinculado" required>
                <option value="" disabled selected>Selecione um projeto...</option>
                <option value="1">Projeto Redesenho do Site</option>
                <option value="2">Projeto Sistema de Vendas</option>
                <option value="3">Projeto Aplicativo Mobile</option>
              </select>
            </div>

            <!-- Campo: Nome da Tarefa -->
            <div class="col-12">
              <label for="nomeTarefa" class="form-label">Nome da Tarefa <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="nomeTarefa" name="nomeTarefa" placeholder="Ex: Ajustar responsividade da tela de login" required>
            </div>

          </div>

          <hr class="my-4">

          <!-- Botões de Ação -->
          <div class="d-flex justify-content-end gap-2">
            <button type="reset" class="btn btn-outline-secondary">
              <i class="bi bi-eraser"></i> Limpar Formulário
            </button>
            
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-lg"></i> Cadastrar Tarefa
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>

  <!-- JavaScript do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
