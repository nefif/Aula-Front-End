<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 550px;">
    <div class="card-body">
      <h3 class="card-title text-center mb-4 fw-bold text-primary">Cadastro de Usuário</h3>
      
      <!-- O atributo action="index.html" redireciona para a tela de login após a validação do formulário -->
      <form action="index.html" method="GET">
        <div class="row g-3">
          <!-- Campo Nome -->
          <div class="col-md-6">
            <label for="nome" class="form-label fw-semibold">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required>
          </div>

          <!-- Campo Sobrenome -->
          <div class="col-md-6">
            <label for="sobrenome" class="form-label fw-semibold">Sobrenome</label>
            <input type="text" class="form-control" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
          </div>

          <!-- Campo Data de Nascimento -->
          <div class="col-md-6">
            <label for="dataNascimento" class="form-label fw-semibold">Data de Nascimento</label>
            <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" required>
          </div>

          <!-- Campo Telefone -->
          <div class="col-md-6">
            <label for="telefone" class="form-label fw-semibold">Telefone</label>
            <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>

          <!-- Campo Email -->
          <div class="col-12">
            <label for="email" class="form-label fw-semibold">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
          </div>

          <!-- Campo Senha -->
          <div class="col-12">
            <label for="senha" class="form-label fw-semibold">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha forte" required>
          </div>

          <!-- Botões de Ação -->
          <div class="col-12 d-flex gap-2 mt-4">
            <button type="reset" class="btn btn-outline-secondary w-50 fw-semibold">Limpar</button>
            <button type="submit" class="btn btn-primary w-50 fw-semibold">Cadastrar</button>
          </div>
        </div>

        <hr class="my-4">

        <!-- Link para voltar ao Login -->
        <div class="text-center">
          <span class="small text-muted">Já tem uma conta? </span>
          <a href="index.html" class="small text-decoration-none fw-semibold">Faça login</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
