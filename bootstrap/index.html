<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - HTML e CSS Puro</title>
  <style>
    /* Reset e Configurações Gerais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container do Formulário */
    .card-cadastro {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .card-cadastro h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e293b;
    }

    /* Agrupamento de Rótulo + Campo */
    .campo-grupo {
      margin-bottom: 15px;
    }

    .campo-grupo label {
      display: block;
      margin-bottom: 5px;
      color: #475569;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .campo-grupo input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    /* Efeito visual ao clicar no campo */
    .campo-grupo input:focus {
      border-color: #2563eb;
    }

    /* Botão de Envio */
    .btn-cadastrar {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-cadastrar:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card-cadastro">
    <h2>Criar Conta</h2>
    
    <form>
      <div class="campo-grupo">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="campo-grupo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="campo-grupo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
      </div>

      <button type="submit" class="btn-cadastrar">Cadastrar</button>
    </form>
  </div>

</body>
</html>
