<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Exemplo de Navbar - Bootstrap 5</title>
  
  <!-- CSS do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

                </li>
                <li class="nav-item">

                </li>
            </ul>
            <div>

        </div>

</html>
