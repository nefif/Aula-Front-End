<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabarito: Formulário com Bootstrap 5</title>
  
  <!-- CDN do Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <!-- Container / Card Centralizado -->
  <div class="card p-4 p-md-5 shadow-sm w-100" style="max-width: 500px;">
    
    <h2 class="text-center text-primary mb-1">Cadastro de Aluno</h2>
    <p class="text-center text-secondary mb-4">Preencha seus dados abaixo para criar sua conta.</p>

    <form>
      <!-- Nome Completo -->
      <div class="mb-3">
        <label for="nome" class="form-label fw-bold text-secondary">Nome Completo</label>
        <input type="text" class="form-control" id="nome" placeholder="Ex: Maria Silva" required>
      </div>

      <!-- E-mail -->
      <div class="mb-3">
        <label for="email" class="form-label fw-bold text-secondary">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
      </div>

      <!-- Senha -->
      <div class="mb-3">
        <label for="senha" class="form-label fw-bold text-secondary">Senha</label>
        <input type="password" class="form-control" id="senha" placeholder="Sua senha secreta" required>
      </div>

      <!-- Telefone -->
      <div class="mb-3">
        <label for="telefone" class="form-label fw-bold text-secondary">Telefone / WhatsApp</label>
        <input type="tel" class="form-control" id="telefone" placeholder="(11) 99999-9999">
      </div>

      <!-- Data de Nascimento -->
      <div class="mb-4">
        <label for="nascimento" class="form-label fw-bold text-secondary">Data de Nascimento</label>
        <input type="date" class="form-control" id="nascimento">
      </div>

      <!-- Botões -->
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar Cadastro</button>
        <button type="reset" class="btn btn-outline-secondary">Limpar</button>
      </div>
    </form>

  </div>

</body>
</html>
