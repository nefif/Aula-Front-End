<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container my-4">

    <!-- Cabeçalho -->
    <div class="row mb-3">

        <div class="col-12">

            <div class="bg-primary text-white text-center p-4 rounded">

                <h2>Cabeçalho</h2>

            </div>

        </div>

    </div>

    <!-- Conteúdo -->
    <div class="row g-3">

        <!-- Menu -->
        <div class="col-12 col-md-3">

            <div class="bg-light border rounded p-3 h-100">

                <h4>Menu</h4>
                    
                <ul class="list-group">
                    <li class="list-group-item">Painel</li>
                    <li class="list-group-item">Projetos</li>
                    <li class="list-group-item">Tarefas</li>
                    <li class="list-group-item">Usuários</li>
                    <li class="list-group-item bg-danger text-white mt-3 rounded">Sair</li>
                </ul>

            </div>

        </div>

        <!-- Conteúdo Principal -->
        <div class="col-12 col-md-9">

            <div class="  rounded p-3">
                <h3>Área Principal</h3>
                <p>
                   Conteúdo principal do sistema.
                </p>
                <!-- cards -->
                <div class="row g-3">
                    <div class="col-12 col-sm-6">
                        <div class="border rounded p-4 text-center bg-primary">
                            Card 1
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <div class="border rounded p-4 text-center bg-warning">
                            Card 2
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <div class="border rounded p-4 text-center bg-danger">
                            Card 3
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <div class="border rounded p-4 text-center bg-success">
                            Card 4
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Rodapé -->
    <div class="row mt-3">

        <div class="col-12">

            <div class="bg-dark text-white text-center p-3 rounded">

                Rodapé

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
