<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula: Tabelas no Bootstrap 5</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="table-responsive">
<table class="table table-striped table-hover table-bordered">
  <thead class="table-success">
    <tr>
      <!-- indica que são títulos das COLUNAS -->
      <th>ID</th>
      <th>Nome</th>
      <th>Curso</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <!-- scope="row" indica que o ID é o identificador desta LINHA -->
      <th>1</th>
      <td>Ana Silva</td>
      <td>Desenvolvimento Web</td>
    </tr>
    <tr>
      <th>2</th>
      <td>Bruno Souza</td>
      <td>Design Gráfico</td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
