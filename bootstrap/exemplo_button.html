<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  
  <!-- CSS do Bootstrap 5 e Ícones do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light p-4">

<div class="container">
  
  <!-- Cabeçalho e Botão de Novo Cadastro -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-list-check"></i> Minhas Tarefas</h2>
    <!-- BOTÃO QUE ABRE O MODAL (data-bs-toggle="modal" e data-bs-target="#modalTarefa") -->
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTarefa" onclick="prepararNovoCadastro()">
      <i class="bi bi-plus-lg"></i> Nova Tarefa
    </button>
  </div>

  <!-- Tabela de Exibição de Tarefas -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Tarefa</th>
            <th>Status</th>
            <th class="text-end pe-4">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Criar layout do Dashboard</td>
            <td><span class="badge bg-warning text-dark">Em Andamento</span></td>
            <td class="text-end pe-3">
              <!-- BOTÃO EDITAR (Abre o modal preenchendo os dados) -->
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editarTarefa('Criar layout do Dashboard')">
                <i class="bi bi-pencil"></i> Editar
              </button>
              <!-- BOTÃO EXCLUIR (Dispara o aviso de exclusão) -->
              <button class="btn btn-sm btn-outline-danger" onclick="excluirTarefa(1)">
                <i class="bi bi-trash"></i> Excluir
              </button>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>Configurar banco de dados</td>
            <td><span class="badge bg-success">Concluída</span></td>
            <td class="text-end pe-3">
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editarTarefa('Configurar banco de dados')">
                <i class="bi bi-pencil"></i> Editar
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="excluirTarefa(2)">
                <i class="bi bi-trash"></i> Excluir
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ========================================== -->
<!-- MODAL DE CADASTRO / EDIÇÃO DE TAREFAS       -->
<!-- ========================================== -->
<div class="modal fade" id="modalTarefa" tabindex="-1" aria-labelledby="modalTarefaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalTarefaLabel">Cadastrar Tarefa</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-body">
        <form id="formTarefa">
          <div class="mb-3">
            <label for="nomeTarefa" class="form-label">Nome da Tarefa</label>
            <input type="text" class="form-control" id="nomeTarefa" placeholder="Ex: Ajustar tela de login" required>
          </div>
          <div class="mb-3">
            <label for="statusTarefa" class="form-label">Status</label>
            <select class="form-select" id="statusTarefa">
              <option value="Pendente">Pendente</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Concluída">Concluída</option>
            </select>
          </div>
        </form>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" onclick="salvarTarefa()">Salvar Tarefa</button>
      </div>

    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- TOAST DE NOTIFICAÇÃO (MENSAGEM DE SUCESSO)  -->
<!-- ========================================== -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastFeedback" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMensagem">
        Ação realizada com sucesso!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<!-- JavaScript do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script simples para controlar as ações dos botões -->
<script>
  // Instâncias do Bootstrap para controlar via JS
  let modalElement = document.getElementById('modalTarefa');
  let modalBs = new bootstrap.Modal(modalElement);
  
  let toastElement = document.getElementById('toastFeedback');
  let toastBs = new bootstrap.Toast(toastElement);

  // Função para preparar o modal para NOVO cadastro
  function prepararNovoCadastro() {
    document.getElementById('modalTarefaLabel').innerText = 'Cadastrar Nova Tarefa';
    document.getElementById('nomeTarefa').value = '';
  }

  // Função disparada ao clicar em EDITAR na tabela
  function editarTarefa(nome) {
    document.getElementById('modalTarefaLabel').innerText = 'Editar Tarefa';
    document.getElementById('nomeTarefa').value = nome;
    modalBs.show(); // Abre o modal via JavaScript
  }

  // Função disparada ao SALVAR dentro do Modal
  function salvarTarefa() {
    let nome = document.getElementById('nomeTarefa').value;
    
    if (nome.trim() === "") {
      alert("Por favor, preencha o nome da tarefa!");
      return;
    }

    modalBs.hide(); // Fecha o modal
    exibirNotificacao("Tarefa gravada com sucesso!");
  }

  // Função disparada ao clicar em EXCLUIR
  function excluirTarefa(id) {
    if (confirm("Tem certeza que deseja excluir a tarefa #" + id + "?")) {
      exibirNotificacao("Tarefa #" + id + " excluída com sucesso!");
    }
  }

  // Função auxiliar para exibir a mensagem Toast
  function exibirNotificacao(texto) {
    document.getElementById('toastMensagem').innerText = texto;
    toastBs.show(); // Mostra a notificação no canto inferior direito
  }
</script>

</body>
</html>
