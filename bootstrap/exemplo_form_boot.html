<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Tarefa - Bootstrap 5</title>
  
  <!-- Bootstrap 5 CSS e Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light p-4">

  <div class="container">
    
    <!-- Cartão Contêiner do Formulário -->
    <div class="card shadow-sm">
      
      <!-- Cabeçalho do Cartão -->
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0 fs-5"><i class="bi bi-file-earmark-plus"></i> Cadastrar Nova Tarefa</h4>
      </div>

      <!-- Corpo do Formulário -->
      <div class="card-body p-4">
        
        <form action="/salvar-tarefa" method="POST">
          
          <div class="row g-3">
            
            <!-- Campo: ID da Tarefa (Desabilitado / Apenas Leitura) -->
            <div class="col-md-4">
              <label for="idTarefa" class="form-label">ID da Tarefa</label>
              <input type="text" class="form-control" id="idTarefa" name="idTarefa" value="#AUTOGERADO" disabled readonly>
            </div>

            <!-- Campo: Projeto Vinculado (Select) -->
            <div class="col-md-8">
              <label for="projetoVinculado" class="form-label">Projeto Vinculado <span class="text-danger">*</span></label>
              <select class="form-select" id="projetoVinculado" name="projetoVinculado" required>
                <option value="" disabled selected>Selecione um projeto...</option>
                <option value="1">Projeto Redesenho do Site</option>
                <option value="2">Projeto Sistema de Vendas</option>
                <option value="3">Projeto Aplicativo Mobile</option>
              </select>
            </div>

            <!-- Campo: Nome da Tarefa -->
            <div class="col-12">
                <div class="form-floating">
                    <input type="text" class="form-control" id="nomeTarefa" name="nomeTarefa" placeholder="Nome da Tarefa" required>
                    <label for="nomeTarefa" class="form-label">Nome da Tarefa <span class="text-danger">*</span></label>   
                </div>
            </div>

          <hr class="my-4">

          <!-- Botões de Ação -->
          <div class="d-flex justify-content-end gap-2">
            <!-- Botão Limpar -->
            <button type="reset" class="btn btn-outline-secondary">
              <i class="bi bi-eraser"></i> Limpar Formulário
            </button>
            
            <!-- Botão Cadastrar -->
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-lg"></i> Cadastrar Tarefa
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>

  <!-- JavaScript do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
