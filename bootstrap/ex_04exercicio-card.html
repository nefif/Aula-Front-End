<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="row g-3">

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card shadow">
                <img src="../html/assets/html_icon.png" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Notebook</h5>
                    <p class="card-text">Notebook para estudos.</p>
                    <h6>R$ 2.999,00</h6>
                    <button class="btn btn-primary w-100">Comprar</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card shadow">
                <img src="../html/assets/html_icon.png" class="card-img-top">
                <div class="card-body">
                    <span class="badge bg-danger mb-2">Promoção</span>
                    <h5 class="card-title">Mouse</h5>
                    <p class="card-text">Mouse sem fio.</p>
                    <h6>R$ 99,90</h6>
                    <button class="btn btn-primary w-100">Comprar</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card shadow">
                <img src="../html/assets/html_icon.png" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Teclado</h5>
                    <p class="card-text">Teclado mecânico.</p>
                    <h6>R$ 199,90</h6>
                    <button class="btn btn-primary w-100">Comprar</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card shadow">
                <img src="../html/assets/html_icon.png" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Monitor</h5>
                    <p class="card-text">Monitor Full HD.</p>
                    <h6>R$ 899,90</h6>
                    <button class="btn btn-primary w-100">Comprar</button>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
