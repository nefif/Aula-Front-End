<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Bootstrap 5</title>
  
  <!-- CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <!-- Card do Formulário -->
  <div class="card p-4 shadow-sm w-100" style="max-width: 400px;">
    <h2 class="text-center mb-4 text-dark fs-3">Criar Conta</h2>

    <form>
      <!-- Campo Nome -->
      <div class="mb-3">
        <label for="nome" class="form-label fw-bold text-secondary">Nome Completo</label>
        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
      </div>

      <!-- Campo E-mail -->
      <div class="mb-3">
        <label for="email" class="form-label fw-bold text-secondary">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
      </div>

      <!-- Campo Senha -->
      <div class="mb-3">
        <label for="senha" class="form-label fw-bold text-secondary">Senha</label>
        <input type="password" class="form-control" id="senha" placeholder="Crie uma senha" required>
      </div>

      <!-- Botão Enviar -->
      <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Cadastrar</button>
    </form>
  </div>

</body>
</html>
