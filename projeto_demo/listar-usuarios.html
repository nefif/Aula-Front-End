<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - Sistema Gestor de Projetos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="area-trabalho.html">Sistema Gestor de Projetos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="listar-projetos.html">Projetos</a></li>
          <li class="nav-item"><a class="nav-link" href="listar-tarefas.html">Tarefas</a></li>
          <li class="nav-item"><a class="nav-link active" href="listar-usuarios.html">Usuários</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Barra de boas-vindas / deslogar -->
  <div class="bg-white border-bottom px-4 py-2 d-flex align-items-center gap-3">
    <span>Bem-vindo(a), <strong>Usuário</strong>!</span>
    <a href="login.html" class="btn btn-outline-danger btn-sm">Deslogar</a>
  </div>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">Usuários</h4>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCadastrarUsuario">
        + Cadastrar Usuário
      </button>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Ana Souza</td>
          <td>ana.souza@email.com</td>
          <td class="text-center">
            <button type="button" class="btn btn-warning btn-sm">Editar</button>
            <button type="button" class="btn btn-danger btn-sm">Excluir</button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Carlos Lima</td>
          <td>carlos.lima@email.com</td>
          <td class="text-center">
            <button type="button" class="btn btn-warning btn-sm">Editar</button>
            <button type="button" class="btn btn-danger btn-sm">Excluir</button>
          </td>
        </tr>
        <tr>
          <td>3</td>
          <td>Beatriz Alves</td>
          <td>beatriz.alves@email.com</td>
          <td class="text-center">
            <button type="button" class="btn btn-warning btn-sm">Editar</button>
            <button type="button" class="btn btn-danger btn-sm">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Cadastrar Usuário -->
  <div class="modal fade" id="modalCadastrarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cadastrar Usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <form id="formUsuario">
            <div class="mb-3">
              <label for="nomeUsuarioModal" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nomeUsuarioModal" required>
            </div>
            <div class="mb-3">
              <label for="emailUsuarioModal" class="form-label">Email</label>
              <input type="email" class="form-control" id="emailUsuarioModal" required>
            </div>
            <div class="mb-3">
              <label for="telefoneUsuarioModal" class="form-label">Telefone</label>
              <input type="tel" class="form-control" id="telefoneUsuarioModal" placeholder="(00) 00000-0000">
            </div>
            <div class="mb-3">
              <label class="form-label d-block">Sexo</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="sexoModal" id="sexoModalM" checked>
                <label class="form-check-label" for="sexoModalM">Masculino</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="sexoModal" id="sexoModalF">
                <label class="form-check-label" for="sexoModalF">Feminino</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="sexoModal" id="sexoModalO">
                <label class="form-check-label" for="sexoModalO">Outro</label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Salvar Usuário</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
