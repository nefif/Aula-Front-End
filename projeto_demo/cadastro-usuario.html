<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário - Sistema Gestor de Projetos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="width: 100%; max-width: 550px;">
      <div class="card-body">
        <h3 class="text-center mb-1">Cadastro de Usuário</h3>
        <p class="text-center text-muted mb-4">Preencha seus dados para criar uma conta</p>

        <!-- Ao cadastrar, volta para a tela de Login -->
        <form action="login.html" method="get">

          <div class="mb-3">
            <label for="nome" class="form-label">Nome completo</label>
            <input type="text" class="form-control" id="nome" name="nome" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="telefone" class="form-label">Telefone</label>
              <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="dataNascimento" class="form-label">Data de nascimento</label>
              <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Sexo</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="sexo" id="sexoMasculino" value="masculino" checked>
              <label class="form-check-label" for="sexoMasculino">Masculino</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="sexo" id="sexoFeminino" value="feminino">
              <label class="form-check-label" for="sexoFeminino">Feminino</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="sexo" id="sexoOutro" value="outro">
              <label class="form-check-label" for="sexoOutro">Outro</label>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmarSenha" class="form-label">Confirmar senha</label>
              <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha" required>
            </div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button type="reset" class="btn btn-outline-secondary w-50">Limpar formulário</button>
            <button type="submit" class="btn btn-primary w-50">Cadastrar Usuário</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
