<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de Trabalho - Sistema Gestor de Projetos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="area-trabalho.html">Sistema Gestor de Projetos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="listar-projetos.html">Projetos</a></li>
          <li class="nav-item"><a class="nav-link" href="listar-tarefas.html">Tarefas</a></li>
          <li class="nav-item"><a class="nav-link" href="listar-usuarios.html">Usuários</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Barra de boas-vindas / deslogar -->
  <div class="bg-white border-bottom px-4 py-2 d-flex align-items-center gap-3">
    <span>Bem-vindo(a), <strong>Usuário</strong>!</span>
    <a href="login.html" class="btn btn-outline-danger btn-sm">Deslogar</a>
  </div>

  <!-- Conteúdo central -->
  <div class="container my-5">
    <h4 class="mb-4 text-center">Resumo da Área de Trabalho</h4>
    <div class="row g-4 justify-content-center">

      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm border-warning">
          <div class="card-body">
            <h6 class="card-title text-muted">Projetos Pendentes</h6>
            <p class="display-6 mb-0">4</p>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm border-success">
          <div class="card-body">
            <h6 class="card-title text-muted">Projetos Concluídos</h6>
            <p class="display-6 mb-0">7</p>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm border-warning">
          <div class="card-body">
            <h6 class="card-title text-muted">Tarefas Pendentes</h6>
            <p class="display-6 mb-0">12</p>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm border-success">
          <div class="card-body">
            <h6 class="card-title text-muted">Tarefas Concluídas</h6>
            <p class="display-6 mb-0">25</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
